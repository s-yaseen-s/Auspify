<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Step 1: Student Login -->
        <div id="start-card" class="card">
            <h1>Online Examination System</h1>
            <p>Complete all questions before the timer runs out.</p>
            <form id="start-form">
                <input type="text" id="student-name" placeholder="Enter Full Name" required>
                <button type="submit">Start Examination</button>
            </form>
        </div>

        <!-- Step 2: Exam View -->
        <div id="exam-card" class="card hidden">
            <div class="exam-header">
                <h2>Exam in Progress</h2>
                <div id="timer" class="timer-badge">Time Left: 03:00</div>
            </div>
            <form id="exam-form">
                <div id="questions-container"></div>
                <button type="submit" class="submit-btn">Submit Exam</button>
            </form>
        </div>

        <!-- Step 3: Result Summary -->
        <div id="result-card" class="card hidden">
            <h2>Examination Complete</h2>
            <div id="score-display"></div>
            <h3>Recent Submissions</h3>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Score</th>
                        <th>Percentage</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="results-tbody"></tbody>
            </table>
            <button onclick="location.reload()">Take Another Test</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
